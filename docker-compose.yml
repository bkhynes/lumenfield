services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: lumenfield
      MYSQL_USER: lumenfield
      MYSQL_PASSWORD: lumenfield
      MYSQL_ROOT_PASSWORD: lumenfield-root
    ports:
      - "3306:3306"
    volumes:
      - lumenfield-mysql:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
volumes:
  lumenfield-mysql:
